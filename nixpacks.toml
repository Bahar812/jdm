[variables]
APP_ENV = "production"
APP_DEBUG = "false"
LOG_CHANNEL = "stderr"
SESSION_DRIVER = "database"
CACHE_STORE = "database"
QUEUE_CONNECTION = "database"
FILESYSTEM_DISK = "local"
PORT = "3000"
NIXPACKS_PHP_ROOT_DIR = "/app/public"
NIXPACKS_PHP_FALLBACK_PATH = "/index.php"
NIXPACKS_NODE_VERSION = "22"

[start]
cmd = "php artisan migrate --force && php artisan db:seed --force && php artisan storage:link || true; php artisan serve --host=0.0.0.0 --port=${PORT}"
